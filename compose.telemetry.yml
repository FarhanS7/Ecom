# compose.telemetry.yml - Optional Jaeger telemetry collector for ShopScale distributed tracing (T071).
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: shopscale-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686' # Jaeger Web UI (http://localhost:16686)
      - '4317:4317'   # OTLP gRPC receiver
      - '4318:4318'   # OTLP HTTP receiver
    restart: unless-stopped
